[project]
name = "eos-switch"
version = "0.1.0"
description = "Edge-of-Stability-aware optimizer switching, extending the OptiRoulette meta-optimizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.7",
    "torchvision",
    "numpy",
    "pyyaml",
    "matplotlib",
    "pandas",
    "optiroulette>=0.1.0",
    # Final-eval metrics (precision/recall/ROC-AUC in metrics.json). Was an
    # ad-hoc container install before; pinned here so uv sync keeps it.
    "scikit-learn",
    # Phase 7 (LM) data prep: GPT-2 BPE + WikiText-103 parquet download.
    "tiktoken",
    "huggingface_hub",
    "pyarrow",
    # Phase 8 (GLUE fine-tuning): pretrained encoders + task data.
    "transformers",
    "datasets",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eos_switch"]

[tool.uv]
# We only ever run inside the Linux container; restricting environments keeps
# the universal lock resolvable against the cu128-only PyTorch index.
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
# Use our vendored, patched OptiRoulette (restores the LR-scaling that the
# PyPI 0.1.0 wheel silently disabled). See third_party/optiroulette.
optiroulette = { path = "third_party/optiroulette" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
