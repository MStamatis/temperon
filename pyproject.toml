[project]
name = "eos-switch"
version = "0.1.0"
description = "Edge-of-Stability-aware optimizer switching, extending the OptiRoulette meta-optimizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.7",
    "torchvision",
    "numpy",
    "pyyaml",
    "matplotlib",
    "pandas",
    "optiroulette>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eos_switch"]

[tool.uv]
# We only ever run inside the Linux container; restricting environments keeps
# the universal lock resolvable against the cu128-only PyTorch index.
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
