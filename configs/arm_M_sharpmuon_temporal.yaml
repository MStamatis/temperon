# arm M (novelty): single-pass sharpness-aware Muon -- TEMPORAL mode. Recovers
# SAM's curvature signal from the gradient trajectory (g - g_prev ~= H*dw) with
# NO second forward-backward. Same wide-R110 + cyclic-catapult setup as the tuned
# SAM+Muon recipe (lr=0.01, wd=0.2) so the comparison is apples-to-apples.
# Bar to match: SAM+Muon-catapult 0.8226 (2-pass). Baseline to beat: plain Muon 0.795.
# rho here is a unitless curvature-blend coefficient (NOT SAM's radius) -- sweepable.
run_name: arm_M_sharpmuon_temporal
seed: 42
device: auto
deterministic: false
epochs: 100
batch_size: 128
mixed_precision: bf16
grad_clip: 2.0

model: resnet110
initial_channels: 64
bn_momentum: 0.01

dataset:
  name: cifar100
  validation_split: 0.1
  val_seed: 42

augment:
  enabled: true
  cutout: 8
  color_jitter: 0.1

controller:
  type: sharp_muon_catapult
  base_optimizer: muon
  sharp_mode: temporal
  rho: 0.05                   # curvature-blend coefficient (sweepable)
  lr: 0.01
  min_lr: 0.0
  momentum: 0.9
  nesterov: true
  weight_decay: 0.2
  n_cycles: 4
  t_mult: 2.0
  warmup_steps: 200

probes:
  enabled: false
