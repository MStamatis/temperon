# Tiny ImageNet baseline: strong SGD (single cosine cycle, no warm restarts).
# Identical pipeline to tiny_sammuon_test.yaml; only the controller differs.
run_name: tiny_strongsgd
seed: 42
device: auto
deterministic: false
epochs: 100
batch_size: 128
mixed_precision: bf16
grad_clip: 2.0

model: resnet110
initial_channels: 64
bn_momentum: 0.01
stem_stride: 2

dataset:
  name: tinyimagenet
  validation_split: 0

augment:
  enabled: true
  cutout: 16
  color_jitter: 0.1

controller:
  type: cyclic_catapult
  base_optimizer: sgd_momentum
  lr: 0.1
  min_lr: 0.0
  momentum: 0.9
  nesterov: true
  weight_decay: 5.0e-4
  n_cycles: 1                # single cosine = strong-SGD (no restarts)
  warmup_steps: 200

probes:
  enabled: false
