# SVHN baseline: strong SGD (single cosine, no restarts). Same pipeline as
# svhn_sammuon.yaml; only the controller differs.
run_name: svhn_strongsgd
seed: 42
device: auto
deterministic: false
epochs: 100
batch_size: 128
mixed_precision: bf16
grad_clip: 2.0

model: resnet110
initial_channels: 64
bn_momentum: 0.01

dataset:
  name: svhn
  validation_split: 0

augment:
  enabled: true
  cutout: 8
  color_jitter: 0.1
  flip: false

controller:
  type: cyclic_catapult
  base_optimizer: sgd_momentum
  lr: 0.1
  min_lr: 0.0
  momentum: 0.9
  nesterov: true
  weight_decay: 5.0e-4
  n_cycles: 1
  warmup_steps: 200

probes:
  enabled: false
