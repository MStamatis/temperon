# Arm Q (literature baseline, Momentum-SAM Becker et al.): zero-extra-pass
# momentum perturbation FULL-TIME on the Muon-catapult. sam_start_frac 1.0
# keeps the true SAM two-pass permanently off; msam_rho drives the single-
# pass perturbed-gradient update. The strongest published rival to the
# hand-off's frontier-time claim. rho_msam=0.3.
# benchmark: c100 / sammuon (auto-generated by gen_bench_configs.py)
run_name: arm_Q_msam_r030
seed: 42
device: auto
deterministic: false
epochs: 100
batch_size: 128
mixed_precision: bf16
grad_clip: 2.0
model: resnet110
initial_channels: 64
bn_momentum: 0.01
stem_stride: 1
dataset:
  name: cifar100
  validation_split: 0
augment:
  enabled: true
  cutout: 8
  color_jitter: 0.1
  flip: true
controller:
  type: sam_catapult
  base_optimizer: muon
  lr: 0.01
  weight_decay: 0.2
  rho: 0.05
  n_cycles: 4
  t_mult: 2.0
  warmup_steps: 200
  ns_dtype: bf16
  sam_freeze_bn: false
  eos_rho: false
  min_lr: 0.0
  momentum: 0.9
  nesterov: true
  sam_start_frac: 1.0
  msam_rho: 0.3
probes:
  enabled: false
