# arm L variant: SAM + cyclic-catapult on a MUON base (Newton-Schulz orthogonalized
# updates) instead of SGD-momentum. SAM is optimizer-agnostic (perturbs in raw-
# gradient weight space, then Muon orthogonalizes the perturbed-point gradient).
# Muon handles 2D+ weights via Newton-Schulz and falls back to plain momentum-SGD
# for 1D params (biases/BN) in a single group -- a simplification vs the canonical
# "Muon for matrices + AdamW for the rest" recipe.
#
# TUNED RECIPE (3-seed confirmed): lr=0.01 (Muon scale, not SGD's 0.1) + decoupled
# weight_decay=0.2 (Muon memorizes at low wd; 0.2 closes the overfit gap). This is
# the PROJECT BEST: final 0.8226 (best 0.8236, sd 0.0011 over 3 seeds), beating
# SAM+SGD-catapult (0.8111) by +1.15pp AND cyclic-J (0.7928) by +3.0pp, while
# hitting 0.75 at epoch ~17 vs SGD's ~38 (~2.3x faster) -- highest final AND fastest.
# Tuning history (seed42): lr sweep -> 0.01 best; wd sweep 5e-4/0.01/0.05/0.1/0.15/0.2
# -> final 0.769/0.780/0.812/0.822/0.821/0.823, plateau from ~0.1 (wd=0.2 most robust
# on 3 seeds). rho fixed (eos_rho off: the EoS-coupling added nothing for SGD).
run_name: arm_L_muon
seed: 42
device: auto
deterministic: false
epochs: 100
batch_size: 128
mixed_precision: bf16
grad_clip: 2.0

model: resnet110
initial_channels: 64
bn_momentum: 0.01

dataset:
  name: cifar100
  validation_split: 0.1      # train on 90%, eval on held-out 10% of train
  val_seed: 42

augment:
  enabled: true
  cutout: 8
  color_jitter: 0.1

controller:
  type: sam_catapult
  base_optimizer: muon
  lr: 0.01                   # PEAK lr (3-seed tuned; Muon scale, not SGD's 0.1)
  min_lr: 0.0
  momentum: 0.9
  nesterov: true
  weight_decay: 0.2          # decoupled in Muon (p *= 1 - lr*wd); closes overfit gap
  n_cycles: 4
  t_mult: 2.0
  warmup_steps: 200
  rho: 0.05                  # fixed SAM radius (eos_rho off)
  sam_freeze_bn: false
  eos_rho: false

probes:
  enabled: false
