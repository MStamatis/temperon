# Phase 7 arm LM-A: Muon+AdamW baseline (no SAM), GPT-2 small on WikiText-103.
# Data-constrained multi-epoch: 400M-token budget over a 50M-token train slice
# (8 passes) -- the repetition regime where SAM's late-phase protection should
# matter. WSD schedule: 250-step warmup, stable, linear decay over final 30%.
# The three lm_* arms are IDENTICAL except sam_mode (off / full / tail).
run_name: lm_muon
seed: 42
ctx: 1024
device_bs: 32
model:
  n_layer: 12
  n_head: 12
  n_embd: 768
data_dir: data/lm/wt103
subset_tokens: 50000000
total_tokens: 400000000
warmup_steps: 250
decay_frac: 0.3
min_lr_frac: 0.0
muon:
  lr: 0.02
  momentum: 0.95
  weight_decay: 0.0
  ns_dtype: bf16
adamw:
  lr: 0.0006
  weight_decay: 0.1
  betas: [0.9, 0.95]
sam_mode: "off"
rho: 0.05
sam_start_frac: 0.7
sam_rho_ramp_steps: 400
grad_clip: 1.0
eval_every: 250
compile: true
