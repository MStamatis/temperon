# Speed variant B (small-moderate risk): SAM+Muon winner + periodic SAM
# (sam_period=2 -> full two-pass every other step, plain single-pass Muon in
# between). Targets SAM's 2x forward-backward (the bigger cost) -> ~1.5x instead
# of 2x. Identical to test_sammuon except sam_period. Risk: the SAM regularization
# (our accuracy edge) degrades gracefully -- watch final acc closely.
run_name: test_sammuon_p2
seed: 42
device: auto
deterministic: false
epochs: 100
batch_size: 128
mixed_precision: bf16
grad_clip: 2.0

model: resnet110
initial_channels: 64
bn_momentum: 0.01

dataset:
  name: cifar100
  validation_split: 0

augment:
  enabled: true
  cutout: 8
  color_jitter: 0.1

controller:
  type: sam_catapult
  base_optimizer: muon
  lr: 0.01
  min_lr: 0.0
  momentum: 0.9
  nesterov: true
  weight_decay: 0.2
  n_cycles: 4
  t_mult: 2.0
  warmup_steps: 200
  rho: 0.05
  sam_freeze_bn: false
  eos_rho: false
  sam_period: 2            # full SAM two-pass every 2 steps; single-pass otherwise

probes:
  enabled: false
