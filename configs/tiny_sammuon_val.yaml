# SAM+Muon on Tiny ImageNet (200 classes, 64x64) -- VAL config for milestone
# tracking: validation_split 0.1 carves a held-out val from train, so per-epoch
# accuracy (the super-convergence milestones) is measured WITHOUT touching the
# official eval set (clean model selection). Use tiny_sammuon_test.yaml for the
# final reported number on the 10k Tiny ImageNet test/val set.
#
# Architecture: wide ResNet-110 (ic=64) with stem_stride=2 -> the 64x64 input is
# downsampled to 32x32 by the stem, so the rest runs at its native CIFAR
# resolution (efficient, memory-friendly). Aug scaled for 64x64 (crop pad auto=8,
# cutout 16). Optimizer HPs transferred from the CIFAR recipe (lr0.01 wd0.2
# rho0.05) -- a deliberate no-retune transfer test; wd may want tuning on the
# harder 200-class task.
run_name: tiny_sammuon_val
seed: 42
device: auto
deterministic: false
epochs: 100
batch_size: 128
mixed_precision: bf16
grad_clip: 2.0

model: resnet110
initial_channels: 64
bn_momentum: 0.01
stem_stride: 2                # 64x64 -> 32x32 at the stem

dataset:
  name: tinyimagenet
  validation_split: 0.1        # held-out val from train -> clean milestones
  val_seed: 42

augment:
  enabled: true
  cutout: 16                   # scaled for 64x64 (CIFAR uses 8 at 32x32)
  color_jitter: 0.1

controller:
  type: sam_catapult
  base_optimizer: muon
  lr: 0.01
  min_lr: 0.0
  momentum: 0.9
  nesterov: true
  weight_decay: 0.2
  n_cycles: 4
  t_mult: 2.0
  warmup_steps: 200
  rho: 0.05
  sam_freeze_bn: false
  eos_rho: false
  ns_dtype: bf16               # free ~10% (canonical Muon default)

probes:
  enabled: false
