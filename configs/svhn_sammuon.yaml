# SVHN (digits, 32x32, 10 classes) -- SAM+Muon. 4th dataset / different DOMAIN
# (digits, not natural images) for the generalization study. 32x32 -> same net as
# CIFAR (stem_stride 1). NB flip:false -- horizontal flip is label-changing for
# digits. SAM+Muon HPs transferred from CIFAR (no re-tune). Test eval.
run_name: svhn_sammuon
seed: 42
device: auto
deterministic: false
epochs: 100
batch_size: 128
mixed_precision: bf16
grad_clip: 2.0

model: resnet110
initial_channels: 64
bn_momentum: 0.01

dataset:
  name: svhn
  validation_split: 0

augment:
  enabled: true
  cutout: 8
  color_jitter: 0.1
  flip: false                 # digits are not flip-invariant

controller:
  type: sam_catapult
  base_optimizer: muon
  lr: 0.01
  min_lr: 0.0
  momentum: 0.9
  nesterov: true
  weight_decay: 0.2
  n_cycles: 4
  t_mult: 2.0
  warmup_steps: 200
  rho: 0.05
  sam_freeze_bn: false
  eos_rho: false
  ns_dtype: bf16

probes:
  enabled: false
