# arm N (novelty): Free-HVP Edge-of-Stability catapult on SAM+Muon. The SAM two
# gradients give a FREE noise-free Hessian-vector product, from which
# SAM.second_step records last_sharpness = g_hat^T H g_hat at zero extra cost. We
# time the warm restarts from it (edge_ratio = sharpness*lr/(2+2*beta); restart
# when it drops below restart_ratio) instead of a fixed cosine period -- arm K's
# idea, but with free same-batch curvature on the winning SAM+Muon base.
# Bar to match/beat: SAM+Muon FIXED-catapult 0.8226 (does adaptive EoS timing
# help speed and/or final?). Same compute as SAM (the curvature is free).
run_name: arm_N_sam_eos_muon
seed: 42
device: auto
deterministic: false
epochs: 100
batch_size: 128
mixed_precision: bf16
grad_clip: 2.0

model: resnet110
initial_channels: 64
bn_momentum: 0.01

dataset:
  name: cifar100
  validation_split: 0.1
  val_seed: 42

augment:
  enabled: true
  cutout: 8
  color_jitter: 0.1

controller:
  type: sam_eos_catapult
  base_optimizer: muon
  lr: 0.01
  min_lr: 0.0
  momentum: 0.9
  nesterov: true
  weight_decay: 0.2
  rho: 0.05
  sam_freeze_bn: false
  warmup_steps: 200
  check_every: 50            # cadence of the (free) restart check
  restart_ratio: 0.1         # catapult when edge_ratio drops below this (settled)
  cycle_epochs: 20.0         # cosine length within a cycle
  min_dwell_checks: 2        # min checks between restarts
  switch_until_frac: 0.8     # stop restarting in the last 20% -> final cosine settles

probes:
  enabled: false
