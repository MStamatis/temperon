# TEST-SET eval, baseline: strong SGD (single cosine, n_cycles=1, no restarts) --
# the standard well-tuned SGD recipe. Same matched wide-R110 pipeline as
# test_sammuon; eval on the official CIFAR-100 TEST set (validation_split: 0).
run_name: test_strongsgd
seed: 42
device: auto
deterministic: false
epochs: 100
batch_size: 128
mixed_precision: bf16
grad_clip: 2.0

model: resnet110
initial_channels: 64
bn_momentum: 0.01

dataset:
  name: cifar100
  validation_split: 0

augment:
  enabled: true
  cutout: 8
  color_jitter: 0.1

controller:
  type: cyclic_catapult
  base_optimizer: sgd_momentum
  lr: 0.1
  min_lr: 0.0
  momentum: 0.9
  nesterov: true
  weight_decay: 5.0e-4
  n_cycles: 1                # single cosine cycle = strong-SGD (no warm restarts)
  warmup_steps: 200

probes:
  enabled: false
