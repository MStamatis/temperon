# arm R: late-phase SAM (arXiv:2410.10373) on svhn, re-run in this
# pipeline for a wall-clock-comparable rival. Auto-generated by
# experiments/gen_latesam_configs.py -- edit that, not this file.
# Pipeline copied from configs/bench\svhn_strongsgd.yaml; SAM budget matched to Temperon
