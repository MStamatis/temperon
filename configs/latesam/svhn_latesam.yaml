run_name: svhn_latesam
seed: 42
device: auto
deterministic: false
epochs: 100
batch_size: 128
mixed_precision: bf16
grad_clip: 2.0
model: resnet110
initial_channels: 64
bn_momentum: 0.01
stem_stride: 1
dataset:
  name: svhn
  validation_split: 0
augment:
  enabled: true
  cutout: 8
  color_jitter: 0.1
  flip: false
controller:
  type: sam_catapult
  base_optimizer: sgd_momentum
  lr: 0.1
  weight_decay: 0.0005
  rho: 0.2
  n_cycles: 1
  warmup_steps: 200
  min_lr: 0.0
  momentum: 0.9
  nesterov: true
  sam_freeze_bn: false
  eos_rho: false
  sam_start_frac: 0.43
probes:
  enabled: false
