# Ablation: Muon on the cyclic-catapult schedule WITHOUT SAM (single forward-
# backward per step). This is the decisive control for "does SAM earn its 2x cost
# on a Muon base?" -- compare against SAM+Muon-catapult (final 0.8226, lr0.01 wd0.2).
#   * Muon-no-SAM ~= 0.82  -> SAM is dead weight (only adds cost); novelty -> Muon.
#   * Muon-no-SAM << 0.82  -> the SAM x Muon synergy is the win; novelty -> SAM-on-Muon.
# wd is swept (0.1/0.2/0.3): without SAM's implicit regularization the Muon optimum
# may sit at a different (likely higher) decoupled wd than the SAM recipe's 0.2.
# Reference: SAM+Muon 0.8226, SAM+SGD-catapult 0.811, cyclic-J (SGD, no SAM) 0.793.
run_name: arm_J_muon
seed: 42
device: auto
deterministic: false
epochs: 100
batch_size: 128
mixed_precision: bf16
grad_clip: 2.0

model: resnet110
initial_channels: 64
bn_momentum: 0.01

dataset:
  name: cifar100
  validation_split: 0.1      # train on 90%, eval on held-out 10% of train
  val_seed: 42

augment:
  enabled: true
  cutout: 8
  color_jitter: 0.1

controller:
  type: cyclic_catapult       # arm J schedule, NO SAM (loop runs single-pass)
  base_optimizer: muon
  lr: 0.01                    # Muon scale (matched to the SAM+Muon recipe)
  min_lr: 0.0
  momentum: 0.9
  nesterov: true
  weight_decay: 0.2           # decoupled in Muon (p *= 1 - lr*wd); swept 0.1/0.2/0.3
  n_cycles: 4
  t_mult: 2.0
  warmup_steps: 200

probes:
  enabled: false
