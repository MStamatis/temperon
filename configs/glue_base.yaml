# Phase 8 shared fine-tuning recipe (RoBERTa-base on small GLUE tasks).
# Standard RoBERTa GLUE hyper-parameters (lr 2e-5, bs 16, max_len 128), except
# the schedule is WSD instead of plain linear decay so that the 'tail' arm gets
# a fresh anneal owned entirely by SAM -- identical in structure to the vision
# hand-off and the Phase-7 LM tail. All three arms share this file; only --arm
# changes, so any difference is attributable to SAM allocation alone.
model: roberta-base
max_len: 128
batch_size: 16
epochs: 10
lr: 0.00002
weight_decay: 0.01
warmup_frac: 0.06
decay_frac: 0.3
rho: 0.05
rho_ramp_frac: 0.02
grad_clip: 1.0
