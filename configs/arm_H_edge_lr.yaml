# Arm H: Edge-of-Stability adaptive LR (super-convergence). Single SGD-momentum
# whose lr is driven to safety*(2+2*beta)/lambda_max, with lambda_max measured
# by power iteration every check_every steps. Trains at the edge to exploit the
# catapult mechanism. Judge primarily by first-hit milestones (speed).
run_name: arm_H_edge_lr
seed: 42
device: auto
deterministic: false
epochs: 100
batch_size: 128
mixed_precision: bf16
grad_clip: 0.0

dataset:
  name: cifar100

augment:
  enabled: true
  cutout: 8

model: resnet18

controller:
  type: edge_lr
  anneal: cosine        # one-cycle-at-the-edge: edge sets the PEAK, cosine -> 0
  momentum: 0.9
  nesterov: true
  weight_decay: 5.0e-4
  lr_init: 0.1
  lr_min: 1.0e-3
  lr_max: 0.5           # cap on the peak (edge-targeted) lr
  safety: 0.9           # peak = 0.9*(2+2b)/lambda_max, then annealed
  check_every: 50       # re-estimate lambda_max / peak every N steps
  power_iters: 20
  micro_batch: 128
  lambda_ema_beta: 0.6  # smoothing of the curvature estimate
  warmup_steps: 200     # linear LR warmup (ramp-up of the one-cycle)

probes:
  enabled: false
