# Ablation B: SAM + Muon on a single cosine (n_cycles=1, NO catapult/warm restarts).
# Isolates whether the catapult specifically helps the SAM+Muon combo: compare to
# SAM+Muon-catapult (0.8226). B vs C (no-SAM, no-catapult) gives SAM's effect on
# Muon WITHOUT restarts. wd swept 0.1/0.2/0.3; rho fixed (eos_rho off).
run_name: arm_L_muon_nocat
seed: 42
device: auto
deterministic: false
epochs: 100
batch_size: 128
mixed_precision: bf16
grad_clip: 2.0

model: resnet110
initial_channels: 64
bn_momentum: 0.01

dataset:
  name: cifar100
  validation_split: 0.1
  val_seed: 42

augment:
  enabled: true
  cutout: 8
  color_jitter: 0.1

controller:
  type: sam_catapult           # SAM two-pass; single cosine when n_cycles=1 -> NO catapult
  base_optimizer: muon
  lr: 0.01
  min_lr: 0.0
  momentum: 0.9
  nesterov: true
  weight_decay: 0.2            # decoupled; swept 0.1/0.2/0.3
  n_cycles: 1                  # <-- single cosine, no warm restarts
  t_mult: 1.0
  warmup_steps: 200
  rho: 0.05
  sam_freeze_bn: false
  eos_rho: false

probes:
  enabled: false
