# TEST-SET eval, winner: SAM+Muon-catapult (lr0.01, wd0.2, rho0.05). Identical
# matched wide-R110 pipeline as the baselines below; differs only in controller.
# validation_split: 0 -> train on the FULL 50k train set, evaluate on the OFFICIAL
# 10k CIFAR-100 TEST set (eval_name="test"). Hyperparameters were tuned on the
# held-out-val runs; this re-trains-and-reports-on-test (no leakage).
run_name: test_sammuon
seed: 42
device: auto
deterministic: false
epochs: 100
batch_size: 128
mixed_precision: bf16
grad_clip: 2.0

model: resnet110
initial_channels: 64
bn_momentum: 0.01

dataset:
  name: cifar100
  validation_split: 0        # <-- eval on the official TEST set, train on full train

augment:
  enabled: true
  cutout: 8
  color_jitter: 0.1

controller:
  type: sam_catapult
  base_optimizer: muon
  lr: 0.01
  min_lr: 0.0
  momentum: 0.9
  nesterov: true
  weight_decay: 0.2
  n_cycles: 4
  t_mult: 2.0
  warmup_steps: 200
  rho: 0.05
  sam_freeze_bn: false
  eos_rho: false

probes:
  enabled: false
