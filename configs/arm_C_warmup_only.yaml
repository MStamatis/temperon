# Arm C (the key ablation): SGD warmup 17 epochs -> AdamW 1e-3 constant.
# NO roulette. SGD phase mirrors the OptiRoulette default warmup optimizer
# (lr 0.1, momentum 0.9, nesterov, wd 5e-4). If this captures most of
# OptiRoulette's gain, switching itself contributes little.
run_name: arm_C_warmup_only
seed: 42
device: auto
deterministic: false
epochs: 100
batch_size: 128
mixed_precision: bf16
grad_clip: 0.0

dataset:
  name: cifar100

augment:
  enabled: true
  cutout: 0

model: resnet18

controller:
  type: sequential
  phases:
    - optimizer: sgd_momentum
      lr: 0.1
      momentum: 0.9
      nesterov: true
      weight_decay: 5.0e-4
      epochs: 17
    - optimizer: adamw
      lr: 1.0e-3
      weight_decay: 0.01

probes:
  enabled: true
  probe_every: 100
  micro_batch: 128
  power_iters: 15
  burst_len: 5
  precond_every: 16       # expensive precond probe: steady-state every 16th probe (~every 4 epochs)
  burst_precond_len: 2     # ...but on the first 2 probes of each post-switch burst (catapult)
