# Paper-comparable track: arm A on ResNet-110 (He et al. CIFAR ResNet).
run_name: paper_A_resnet110
seed: 42
device: auto
deterministic: false
epochs: 100
batch_size: 128
mixed_precision: bf16
grad_clip: 0.0

dataset:
  name: cifar100

augment:
  enabled: true
  cutout: 0

model: resnet110

controller:
  type: fixed
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 0.01
  schedule: none

probes:
  enabled: true
  probe_every: 100
  micro_batch: 128
  power_iters: 15
  burst_len: 5
  precond_every: 16       # expensive precond probe: steady-state every 16th probe (~every 4 epochs)
  burst_precond_len: 2     # ...but on the first 2 probes of each post-switch burst (catapult)
