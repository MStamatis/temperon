# Money control (SS-SAM/RST family): UNIFORM periodic SAM, sam_period=2
# (50% of steps two-pass ~ arm P's 57% SAM budget). If allocation SHAPE
# matters (contiguous tail >> uniform), this must land BELOW arm P's
# 0.8275 despite a comparable budget. c10 evidence already says -0.4pp.
# benchmark: c100 / sammuon (auto-generated by gen_bench_configs.py)
run_name: c100_sammuon_p2
seed: 42
device: auto
deterministic: false
epochs: 100
batch_size: 128
mixed_precision: bf16
grad_clip: 2.0
model: resnet110
initial_channels: 64
bn_momentum: 0.01
stem_stride: 1
dataset:
  name: cifar100
  validation_split: 0
augment:
  enabled: true
  cutout: 8
  color_jitter: 0.1
  flip: true
controller:
  type: sam_catapult
  base_optimizer: muon
  lr: 0.01
  weight_decay: 0.2
  rho: 0.05
  n_cycles: 4
  t_mult: 2.0
  warmup_steps: 200
  ns_dtype: bf16
  sam_freeze_bn: false
  eos_rho: false
  min_lr: 0.0
  momentum: 0.9
  nesterov: true
  sam_period: 2
probes:
  enabled: false
