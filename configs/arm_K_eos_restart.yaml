# Arm K: EoS-triggered warm restarts (novel). Wide ResNet-110 + OptiRoulette-
# matched data pipeline. Restart (catapult) fires when edge_ratio =
# batch_sharpness*lr/(2+2*beta) drops below restart_ratio (flat/converged
# basin), not on a fixed schedule. Run head-to-head vs cyclic-J / OptiRoulette.
run_name: arm_K_eos_restart
seed: 42
device: auto
deterministic: false
epochs: 100
batch_size: 128
mixed_precision: bf16
grad_clip: 2.0

dataset:
  name: cifar100
  validation_split: 0.1
  val_seed: 42

augment:
  enabled: true
  cutout: 8
  color_jitter: 0.1

model: resnet110
initial_channels: 64
bn_momentum: 0.01

controller:
  type: eos_restart
  lr: 0.1                 # peak (catapult) lr
  min_lr: 0.0
  momentum: 0.9
  nesterov: true
  weight_decay: 5.0e-4
  warmup_steps: 200
  check_every: 50         # measure batch_sharpness every N steps
  restart_ratio: 0.1      # restart when edge_ratio drops below this
  cycle_epochs: 20        # cosine length within a cycle (nominal)
  min_dwell_checks: 2     # no restart within this many checks of the last
  switch_until_frac: 0.8  # stop restarting after 80% -> final cosine settles

probes:
  enabled: false
