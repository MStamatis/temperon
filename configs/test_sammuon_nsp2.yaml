# Speed variant C (combined): SAM+Muon winner + NS bf16/3-steps + periodic SAM.
# Stacks variant A (NS knobs) and B (sam_period=2) for the maximum speed-up. The
# likely-best wall-clock if accuracy holds; the riskiest on accuracy (watch final).
run_name: test_sammuon_nsp2
seed: 42
device: auto
deterministic: false
epochs: 100
batch_size: 128
mixed_precision: bf16
grad_clip: 2.0

model: resnet110
initial_channels: 64
bn_momentum: 0.01

dataset:
  name: cifar100
  validation_split: 0

augment:
  enabled: true
  cutout: 8
  color_jitter: 0.1

controller:
  type: sam_catapult
  base_optimizer: muon
  lr: 0.01
  min_lr: 0.0
  momentum: 0.9
  nesterov: true
  weight_decay: 0.2
  n_cycles: 4
  t_mult: 2.0
  warmup_steps: 200
  rho: 0.05
  sam_freeze_bn: false
  eos_rho: false
  ns_dtype: bf16
  ns_steps: 3
  sam_period: 2

probes:
  enabled: false
