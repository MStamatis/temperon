# Speed variant A (low risk): SAM+Muon winner + Newton-Schulz speed knobs
# (NS in bf16, ns_steps 5->3). Targets Muon's NS overhead -- which baselines do
# NOT have -> narrows the wall-clock gap fairly. Identical to test_sammuon except
# the two NS knobs. Compare s/epoch + final vs test_sammuon (CIFAR-10 wide: 94s,
# 0.9703). bf16 NS = the original Muon default (near-zero risk); ns_steps 3 = low.
run_name: test_sammuon_ns
seed: 42
device: auto
deterministic: false
epochs: 100
batch_size: 128
mixed_precision: bf16
grad_clip: 2.0

model: resnet110
initial_channels: 64
bn_momentum: 0.01

dataset:
  name: cifar100
  validation_split: 0

augment:
  enabled: true
  cutout: 8
  color_jitter: 0.1

controller:
  type: sam_catapult
  base_optimizer: muon
  lr: 0.01
  min_lr: 0.0
  momentum: 0.9
  nesterov: true
  weight_decay: 0.2
  n_cycles: 4
  t_mult: 2.0
  warmup_steps: 200
  rho: 0.05
  sam_freeze_bn: false
  eos_rho: false
  ns_dtype: bf16            # Newton-Schulz in bf16 (original Muon default; ~free)
  ns_steps: 3              # fewer NS iterations (5 -> 3)

probes:
  enabled: false
