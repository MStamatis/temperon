# Arm P transfer (tiny): hand-off cyclic-J SGD (43 ep) -> single-cosine
# SAM+SGD tail (57 ep), mirroring bench tiny_samsgd's optimizer params.
# Tiny uses the SAM+SGD tail (the tiny-reversal winner) -- the modular-
# refiner test: is the allocation principle refiner-agnostic?
run_name: arm_P_tiny
seed: 42
device: auto
deterministic: false
epochs: 100
batch_size: 128
mixed_precision: bf16
grad_clip: 2.0
model: resnet110
initial_channels: 64
bn_momentum: 0.01
stem_stride: 2
dataset:
  name: tinyimagenet
  validation_split: 0
augment:
  enabled: true
  cutout: 16
  color_jitter: 0.1
  flip: true
controller:
  type: handoff
  handoff_epoch: 43
  handoff_transfer: momentum
  stage1:
    type: cyclic_catapult
    base_optimizer: sgd_momentum
    lr: 0.1
    weight_decay: 0.0005
    n_cycles: 4
    t_mult: 2.0
    warmup_steps: 200
    min_lr: 0.0
    momentum: 0.9
    nesterov: true
  stage2:
    type: sam_catapult
    base_optimizer: sgd_momentum
    lr: 0.1
    weight_decay: 0.0005
    rho: 0.2
    n_cycles: 1
    t_mult: 1.0
    warmup_steps: 200
    sam_freeze_bn: false
    eos_rho: false
    min_lr: 0.0
    momentum: 0.9
    nesterov: true
    sam_rho_ramp_steps: 400
probes:
  enabled: false
