[project]
name = "temperon"
version = "0.1.1"
description = "Temperon: pay for sharpness-aware minimization only where it pays you back"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Stamatis Mastromichalakis", email = "stamatis@tmnetworks.gr" }]
keywords = ["pytorch", "optimizer", "sharpness-aware-minimization", "sam", "muon", "training-efficiency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.0"]

[project.urls]
Homepage = "https://github.com/MStamatis/temperon"
Repository = "https://github.com/MStamatis/temperon"
Issues = "https://github.com/MStamatis/temperon/issues"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/temperon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
